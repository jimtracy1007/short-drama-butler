interface:
  display_name: "短剧管家"
  short_description: "管理AI短剧项目记忆，并在出图时强制附上已确认角色/场景参考图"
  default_prompt: "使用 $short-drama-butler。先运行 butler.py status 与 inspect。用户没故事时先 propose-story；做图时必须把已确认角色/场景/道具母版读进对话，能装进 5 张就一次 generate，不要默认先背景后人物，不要为补深夜另开空房间阶段，也不要在出图中改脚本；夜戏必须先有已确认 night 场景视图，禁止用白天母版出夜戏；dispatch-keyframe 后先原样输出 brief.text（本图故事只写这一张、本镜引用素材、制作注意）再读图出图；出图提示词以分镜本帧画面+视觉锁+资产名为准，不要把整段动作或运镜落幅画进静帧；角色参考图只锁外貌服装，禁止抄站姿；整体空间当背景，场景母版里已有固定物按道具锁，禁止新增窗口或糊成新结构；关键帧必须按帧派子 agent 出图，当前这一镜有几帧就同时派几个，做完审核后再开下一镜，精修和重做也按被重开的帧派，主 agent 不自己出图只审核，子 agent 只 record-image 不 record-qa；用户要改画面用 refine-keyframe 追加，不要手写缩水版；质检只锁身份/空间/时段，空间结构不一致必须 fail 并 refine，分镜要求的走位必须通过；禁止纯文生图，禁止镜头链式参考（上一镜只作辅助连续性，不得当唯一或主身份锁）。"
